spring.application.name=cadastro-fornecedores
server.address=127.0.0.1
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/fornecedores}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_SENHA:}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
cadastro.admin.usuario=${ADMIN_USUARIO:administrador}
cadastro.admin.senha=${ADMIN_SENHA:}
